name: 全市場三率營收一次性修復

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "修復日期 YYYY-MM-DD；留白 = 最近已收盤工作日"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: fundamental-full-market-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Install packages
        run: python -m pip install -r automation/requirements.txt

      - name: Resolve target date
        id: target
        shell: bash
        env:
          MANUAL_DATE: ${{ github.event.inputs.target_date }}
        run: |
          if [ -n "$MANUAL_DATE" ]; then
            TARGET_DATE="$MANUAL_DATE"
          else
            TARGET_DATE=$(python - <<'PYDATE'
          import datetime as dt
          from zoneinfo import ZoneInfo
          now=dt.datetime.now(ZoneInfo("Asia/Taipei"))
          day=now.date() if now.hour>=16 else now.date()-dt.timedelta(days=1)
          while day.weekday()>=5:
              day-=dt.timedelta(days=1)
          print(day.isoformat())
          PYDATE
            )
          fi
          echo "date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "TARGET_DATE=$TARGET_DATE"

      - name: Restore repaired runtime cache
        uses: actions/cache@v5
        with:
          path: |
            automation/duckbill/stock.db
            automation/duckbill/stock.db-wal
            automation/duckbill/stock.db-shm
          key: tw-stock-runtime-v25-${{ runner.os }}-${{ steps.target.outputs.date }}-cleanup-v22-${{ github.run_id }}
          restore-keys: |
            tw-stock-runtime-v25-${{ runner.os }}-${{ steps.target.outputs.date }}-cleanup-v21-
            tw-stock-runtime-v25-${{ runner.os }}-${{ steps.target.outputs.date }}-quarter-batch-v2-
            tw-stock-runtime-v25-${{ runner.os }}-
            tw-stock-runtime-${{ runner.os }}-

      - name: Bootstrap database on cache miss
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f automation/duckbill/stock.db ]; then
            mkdir -p /tmp/tw-stock-seed
            gh release download seed-v2 --pattern "bootstrap_seed_v2.zip" --dir /tmp/tw-stock-seed
            unzip -q /tmp/tw-stock-seed/bootstrap_seed_v2.zip -d .
          fi
          test -f automation/duckbill/stock.db

      - name: Rebuild Duckbill target workbook
        run: |
          python -u automation/duckbill/stock_duckbill.py \
            --update --date "${{ steps.target.outputs.date }}"

      - name: Normal quarterly batch backfill
        run: |
          python -u automation/duckbill/fundamental_batch_income_backfill.py \
            --date "${{ steps.target.outputs.date }}"

      - name: Clean remaining three-rate exceptions
        run: |
          python -u automation/duckbill/fundamental_three_rate_cleanup.py \
            --date "${{ steps.target.outputs.date }}" \
            --batch-retries 3 \
            --single-tries 2

      - name: Re-validate and write workbook
        run: |
          TARGET_TAG=$(echo "${{ steps.target.outputs.date }}" | tr -d '-')
          python -u automation/duckbill/fundamental_full_market_fix.py \
            --date "${{ steps.target.outputs.date }}" \
            --workbook "automation/duckbill/output/${TARGET_TAG}_鴨嘴篩選結果.xlsx"
          cp "automation/duckbill/output/${TARGET_TAG}_鴨嘴篩選結果.xlsx" duck_latest.xlsx

      - name: Finalize three-rate display from verified history
        run: |
          python -u automation/duckbill/fundamental_three_rate_finalizer.py \
            --date "${{ steps.target.outputs.date }}" \
            --workbook duck_latest.xlsx

      - name: Show final classified summary
        run: |
          python - <<'PY'
          import json
          a=json.load(open("fundamental_three_rate_cleanup_status.json",encoding="utf-8"))
          b=json.load(open("fundamental_full_market_status.json",encoding="utf-8"))
          c=json.load(open("fundamental_three_rate_finalizer_status.json",encoding="utf-8"))
          print("=== 三率例外清理 ===")
          print("核心缺口:", a.get("core_missing_before"), "→", a.get("core_missing_after"))
          print("底層驗收:", json.dumps(a.get("validation_after"),ensure_ascii=False,indent=2))
          print("真正仍需追蹤:", a.get("true_unresolved_count"))
          print("\n=== v2.2 Excel/JSON 最終顯示 ===")
          print(json.dumps(c.get("counts"),ensure_ascii=False,indent=2))
          print("2382:", json.dumps(c.get("quanta_2382"),ensure_ascii=False,indent=2))
          PY

      - name: Commit repaired workbook and reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add duck_latest.xlsx \
                  fundamental_full_market_status.json \
                  fundamental_batch_income_backfill_status.json \
                  fundamental_three_rate_cleanup_status.json \
                  fundamental_three_rate_exceptions.csv \
                  fundamental_three_rate_finalizer_status.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "fix: finalize full-market three-rate display ${{ steps.target.outputs.date }}"
            git push origin HEAD:main
          fi
